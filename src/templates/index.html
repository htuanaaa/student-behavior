<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Phân Tích Hành Vi AI</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #1e1e2e; color: #cdd6f4; margin: 0; padding: 10px; }
        h2 { margin-top: 15px; font-size: 1.5rem; }
        .container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .box { width: 45%; min-width: 320px; background: #313244; padding: 20px; border-radius: 12px; box-sizing: border-box; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        img { width: 100%; border-radius: 8px; background-color: #11111b; min-height: 250px; object-fit: cover; }
        
        button, input { margin-top: 15px; padding: 12px 15px; font-size: 16px; border-radius: 8px; border: none; width: 100%; box-sizing: border-box; }
        input[type="text"] { background-color: #181825; color: #cdd6f4; border: 1px solid #45475a; }
        button { background-color: #89b4fa; color: #11111b; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #b4befe; }
        .btn-danger { background-color: #f38ba8 !important; }
        
        @media (max-width: 768px) {
            .box { width: 100%; padding: 15px; }
            .container { gap: 15px; }
        }

        /* Khung chứa lịch sử hành vi ngang */
        .history-section { margin-top: 30px; background: #313244; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: left; }
        .history-section h3 { margin-top: 0; margin-bottom: 15px; color: #cdd6f4; font-size: 1.2rem; }
        
        .card-container { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px; }
        .card-container::-webkit-scrollbar { height: 8px; }
        .card-container::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }
        
        .alert-card { background: #181825; border: 1px solid #45475a; border-radius: 8px; padding: 12px; min-width: 160px; text-align: center; box-sizing: border-box; }
        .alert-card img { width: 100%; height: 120px; border-radius: 6px; object-fit: cover; margin-bottom: 10px; background-color: #11111b; min-height: unset; }
        .alert-card p { margin: 5px 0; font-size: 0.9rem; }
        .alert-card .id-text { font-weight: bold; color: #cdd6f4; }
        .alert-card .time-text { color: #a6adc8; font-size: 0.8rem; }
        .bad-behavior { color: #f38ba8; font-weight: bold; }
        .good-behavior { color: #a6e3a1; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Giám Sát Hành Vi Sinh Viên (YOLOv8)</h2>

    <div class="container">
        <!-- Khối 1: HỢP NHẤT LIVE CAMERA -->
        <div class="box">
            <h3>🔴 Live Camera</h3>
            <img id="live-camera-img" alt="Bấm Bật Camera để xem">
            
            <div style="text-align: left; margin-top: 15px;">
                <label for="cameraSource" style="font-size: 0.9rem; color: #a6adc8;">
                    Nhập <b>0</b> (Dùng máy này) hoặc <b>Link IP</b> (Camera ngoài):
                </label>
                <input type="text" id="cameraSource" placeholder="VD: 0 hoặc 192.168.1.10:4747/video" value="0">
            </div>
            
            <button onclick="startCamera()">Bật Camera</button>
            <button class="btn-danger" onclick="stopCamera()">Tắt Camera</button>
        </div>

        <!-- Khối 2: UPLOAD VIDEO -->
        <div class="box">
            <h3>📁 Upload Video</h3>
            <img id="video-img" alt="Tải video lên để nhận diện">
            <input type="file" id="videoUpload" accept="video/*" style="color: #cdd6f4; background: #181825;">
            <button onclick="uploadAndProcess()">Nhận diện ngay</button>
            <p id="upload-status" style="color: #a6e3a1; font-weight: bold; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- KHỐI HIỂN THỊ THẺ BÀI NGANG -->
    <div class="history-section">
        <h3>🔍 Nhật Ký Hành Vi (Real-time)</h3>
        <div class="card-container" id="alert-list">
            <p style="color: #a6adc8; font-style: italic;" id="empty-msg">Chưa phát hiện hành vi nào...</p>
        </div>
    </div>

    <script>
        // ==========================================
        // BIẾN TOÀN CỤC CHO LIVE CAMERA
        // ==========================================
        let currentMode = null; // Lưu trạng thái: 'client' (thiết bị) hoặc 'ip' (cctv ngoài)
        let ws;
        let isStreaming = false;
        let lastAlertsStr = "";
        
        const videoElement = document.createElement("video");
        videoElement.setAttribute('playsinline', ''); 
        const canvasElement = document.createElement("canvas");
        const ctx = canvasElement.getContext("2d");

        // ==========================================
        // BỘ ĐIỀU PHỐI (ROUTER) KHI BẤM NÚT BẬT
        // ==========================================
        async function startCamera() {
            // Tắt camera hiện tại trước khi bật cái mới (tránh bị lỗi đè luồng)
            stopCamera();

            const sourceInput = document.getElementById('cameraSource').value.trim();
            
            if (sourceInput === "0") {
                currentMode = 'client';
                await startClientWebcam();
            } else if (sourceInput !== "") {
                currentMode = 'ip';
                startIPCamera(sourceInput);
            } else {
                alert("Vui lòng nhập 0 hoặc Link IP!");
            }
        }

        // ==========================================
        // LOGIC 1: CAMERA CỦA THIẾT BỊ (WEBSOCKET)
        // ==========================================
        async function startClientWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480, facingMode: "user" } 
                });
                videoElement.srcObject = stream;
                videoElement.play();
            } catch (err) {
                alert("Không thể truy cập camera. Hãy kiểm tra quyền trên trình duyệt nhé!");
                return;
            }

            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/client_webcam`);

            ws.onopen = () => {
                isStreaming = true;
                sendFrameToServer();
            };

            ws.onmessage = (event) => {
                document.getElementById('live-camera-img').src = event.data;
            };
        }

        function sendFrameToServer() {
            if (!isStreaming) return;
            if (videoElement.videoWidth === 0 || videoElement.videoHeight === 0) {
                setTimeout(sendFrameToServer, 100);
                return;
            }
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            ctx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
            
            const imageData = canvasElement.toDataURL("image/jpeg", 0.7);
            ws.send(imageData);
            setTimeout(sendFrameToServer, 100); // Tốc độ gửi frame (10 FPS)
        }

        // ==========================================
        // LOGIC 2: IP CAMERA NGOÀI (MJPEG)
        // ==========================================
        function startIPCamera(sourceUrl) {
            // Gọi API /live_stream_feed trên Backend của bạn
            const streamUrl = `/live_stream_feed?source=${encodeURIComponent(sourceUrl)}`;
            document.getElementById('live-camera-img').src = streamUrl;
        }

        // ==========================================
        // BỘ ĐIỀU PHỐI KHI BẤM NÚT TẮT
        // ==========================================
        function stopCamera() {
            if (currentMode === 'client') {
                isStreaming = false;
                if (ws) ws.close();
                if (videoElement.srcObject) {
                    videoElement.srcObject.getTracks().forEach(track => track.stop());
                }
            } 
            
            // Xóa ảnh trên màn hình và ngắt kết nối MJPEG/WebSocket
            document.getElementById('live-camera-img').src = "";
            currentMode = null;
        }

        // ==========================================
        // LOGIC UPLOAD VIDEO CŨ
        // ==========================================
        async function uploadAndProcess() {
            const fileInput = document.getElementById('videoUpload');
            const statusText = document.getElementById('upload-status');
            
            if (fileInput.files.length === 0) {
                alert("Vui lòng chọn 1 file video!");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            statusText.innerText = "Đang tải lên server...";

            try {
                const response = await fetch('/upload_video', { method: 'POST', body: formData });
                const data = await response.json();
                statusText.innerText = "Đang phát video nhận diện...";
                document.getElementById('video-img').src = data.stream_url;
            } catch (error) {
                statusText.innerText = "Lỗi tải video!";
            }
        }

        setInterval(async () => {
            if (isStreaming || currentMode === 'ip' || document.getElementById('video-img').src !== "") {
                try {
                    const response = await fetch('/api/stats');
                    const data = await response.json();

                    const alerts = data.alerts;
                    const currentAlertsStr = JSON.stringify(alerts);

                    if (alerts.length > 0 && currentAlertsStr !== lastAlertsStr) {
                        const alertContainer = document.getElementById('alert-list');
                        alertContainer.innerHTML = '';

                        alerts.forEach(alert => {
                            const behaviorClass = alert.type === 'bad' ? 'bad-behavior' : 'good-behavior';

                            const cardHTML = `
                                <div class="alert-card">
                                    <img src="data:image/jpeg;base64,${alert.image}" alt="Crop">
                                    <p class="id-text">Sinh viên ID: ${alert.id}</p>
                                    <p class="${behaviorClass}">${alert.behavior}</p>
                                    <p class="time-text">⏱ ${alert.time}</p>
                                </div>
                            `;
                            alertContainer.innerHTML += cardHTML;
                        });
                        lastAlertsStr = currentAlertsStr;
                    }
                } catch (error) {
                    console.error("Lỗi lấy dữ liệu:", error);
                }
            }
        }, 500);
    </script>
</body>
</html>
